apiVersion: v1
kind: ConfigMap
metadata:
  name: exam-config
  namespace: default
  labels:
    app.kubernetes.io/name: exam-system
    app.kubernetes.io/part-of: online-exam-portal
data:
  NODE_ENV: "production"
  PORT: "5000"
  MONGODB_URI: "mongodb://mongodb-service:27017/online_exam_db"
  CLIENT_URL: "http://frontend-service"
  JWT_EXPIRES_IN: "7d"
