version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: exam_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: online_exam_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - exam_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/online_exam_db
      - JWT_SECRET=dev_secret_key_1615_online_exam_jwt_secure_token
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - exam_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exam_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - exam_network

volumes:
  mongodb_data:
    driver: local

networks:
  exam_network:
    driver: bridge
